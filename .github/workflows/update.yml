name: Update Bing image

# Controls when the action will run. Triggers the workflow on push or pull request
# events but only for the master branch
on:
  workflow_dispatch:
  push:
    branches: [ master ]
    paths: 
      - 'script/crawler.py'
      - '.github/workflows/update.yml'
  schedule:
    # 15:00 every day Asia/Shanghai
    - cron: "0 7 * * *"

permissions:
  contents: write

# A workflow run is made up of one or more jobs that can run sequentially or in parallel
jobs:
  build:
    # The type of runner that the job will run on
    runs-on: ubuntu-latest

    # Steps represent a sequence of tasks that will be executed as part of the job
    steps:
      # Checks-out your repository under $GITHUB_WORKSPACE, so your job can access it
      - name: Checkout code
        uses: actions/checkout@v6

      - name: Set up Python 3.13
        uses: actions/setup-python@v6
        with:
          python-version: '3.13'
          cache: pip
          cache-dependency-path: script/requirements.txt

      - name: Install dependencies
        run: |
          cd script
          python -m pip install --upgrade pip
          python -m pip install -r requirements.txt
      
      - name: Echo the event name
        run: |
          echo ${{ github.event }}
          echo ${{ github.event_name }}
      
      - name: Update image with wait
        if: github.event_name == 'schedule'
        run: |
          export TZ=Asia/Shanghai
          cd script
          python crawler.py --wait
        env:
          BOTTOKEN: ${{ secrets.BOTTOKEN }}
          CHANNELIDMAIN: ${{ secrets.CHANNELIDMAIN }}
          CHANNELIDARCHIVE: ${{ secrets.CHANNELIDARCHIVE }}
          
      - name: Update image without wait
        if: github.event_name != 'schedule'
        run: |
          export TZ=Asia/Shanghai
          cd script
          python crawler.py
        env:
          BOTTOKEN: ${{ secrets.BOTTOKEN }}
          CHANNELIDMAIN: ${{ secrets.CHANNELIDMAIN }}
          CHANNELIDARCHIVE: ${{ secrets.CHANNELIDARCHIVE }}

      - name: Move files to archive
        run: |
          pwd
          mkdir archive
          mv data archive
          mv img archive
      
      - name: Push archives
        uses: JamesIves/github-pages-deploy-action@v4
        with:
          git-config-name: Bing Image Bot
          git-config-email: action@github.com
          branch: archive # The branch the action should deploy to.
          folder: archive # The folder the action should deploy.
          clean: false # Don't automatically remove deleted files from the deploy branch.
          commit-message: Update Bing images.
